# Progressive help for Day 15. Solutions assume namespace cka-d15 is the default.
# Node work uses a sysadmin debug Pod + chroot /host, the non-interactive twin of:
#   kubectl debug node/<node> -it --profile=sysadmin --image=busybox:1.36   then   chroot /host
exercises:
  "15.1":
    docs:
      - title: Operating etcd clusters — backing up an etcd cluster
        url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/#backing-up-an-etcd-cluster
      - title: Debugging Kubernetes nodes with kubectl
        url: https://kubernetes.io/docs/tasks/debug/debug-cluster/kubectl-node-debug/
    hint: >-
      The etcd manifest (`/etc/kubernetes/manifests/etcd.yaml`) tells you everything:
      `--listen-client-urls` gives the endpoint, `--trusted-ca-file`, `--cert-file`, `--key-file` give
      the TLS files for `etcdctl --cacert/--cert/--key`. Create `/opt/cka-etcd` first.
    automated: true
    solution: |
      node_pod() {   # find or start a sysadmin debug Pod on a node
        local p; p=$(kubectl get pods -o name | grep "node-debugger-$1" | head -1 || true)
        if [ -z "$p" ]; then
          kubectl debug "node/$1" --image=busybox:1.36 --profile=sysadmin -- sleep 3600 >/dev/null
          p=$(kubectl get pods -o name | grep "node-debugger-$1" | head -1 || true)
        fi
        kubectl wait --for=condition=Ready "$p" --timeout=90s >/dev/null && echo "$p"
      }
      CP=$(node_pod cka-14d-control-plane)
      kubectl exec "$CP" -- chroot /host grep -E -- '--(listen-client-urls|trusted-ca-file|cert-file|key-file)=' /etc/kubernetes/manifests/etcd.yaml
      kubectl exec "$CP" -- chroot /host sh -c '
        mkdir -p /opt/cka-etcd
        ETCDCTL_API=3 etcdctl --endpoints=https://127.0.0.1:2379 \
          --cacert=/etc/kubernetes/pki/etcd/ca.crt \
          --cert=/etc/kubernetes/pki/etcd/server.crt \
          --key=/etc/kubernetes/pki/etcd/server.key \
          snapshot save /opt/cka-etcd/backup.db'
      kubectl exec "$CP" -- chroot /host etcdutl snapshot status /opt/cka-etcd/backup.db -w table
  "15.2":
    docs:
      - title: Operating etcd clusters — restoring an etcd cluster
        url: https://kubernetes.io/docs/tasks/administer-cluster/configure-upgrade-etcd/#restoring-an-etcd-cluster
      - title: Static Pods
        url: https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/
    hint: >-
      `etcdutl snapshot restore <file> --data-dir <new dir>` writes a fresh data directory (it refuses
      an existing one). Then edit `etcd.yaml`: change only the `hostPath.path` of the `etcd-data`
      volume — the container still mounts it at `/var/lib/etcd`. kubelet restarts etcd by itself.
      Then restart kube-apiserver, controller-manager and scheduler (`crictl stop` their containers):
      an API server that stayed up keeps a watch cache from before the restore, and objects
      "come back" or namespaces hang in Terminating.
    automated: true
    solution: |
      node_pod() {
        local p; p=$(kubectl get pods -o name | grep "node-debugger-$1" | head -1 || true)
        if [ -z "$p" ]; then
          kubectl debug "node/$1" --image=busybox:1.36 --profile=sysadmin -- sleep 3600 >/dev/null
          p=$(kubectl get pods -o name | grep "node-debugger-$1" | head -1 || true)
        fi
        kubectl wait --for=condition=Ready "$p" --timeout=90s >/dev/null && echo "$p"
      }
      RESTORE_DIR=$(kubectl get configmap etcd-drill -o jsonpath='{.data.restoreDir}')
      echo "Restoring into $RESTORE_DIR"
      kubectl create configmap after-backup --from-literal=created=after-the-snapshot
      CP=$(node_pod cka-14d-control-plane)
      # One node-side command: restore into a NEW dir, then repoint only the data volume's hostPath
      # ("mountPath:" and "--data-dir=" stay /var/lib/etcd). The API may time out while etcd
      # restarts; the commands still finish on the node.
      kubectl exec "$CP" -- chroot /host sh -c "
        etcdutl snapshot restore /opt/cka-etcd/backup.db --data-dir $RESTORE_DIR 2>&1 | tail -1 &&
        sed -E -i 's#^( +path: )/var/lib/etcd.*#\1$RESTORE_DIR#' /etc/kubernetes/manifests/etcd.yaml &&
        grep -E '^ +path: /var/lib/etcd' /etc/kubernetes/manifests/etcd.yaml"         || echo "(API hiccup while etcd restarts; check the node state below)"
      sleep 40
      until kubectl get --raw=/readyz >/dev/null 2>&1; do sleep 5; done
      kubectl exec "$CP" -- chroot /host grep -E '^ +path: /var/lib/etcd' /etc/kubernetes/manifests/etcd.yaml
      # Restart the control plane so nothing serves pre-restore cached state. kube-apiserver goes
      # last because this exec session runs through it. Repeat until it really started after etcd.
      started() { kubectl -n kube-system get pod "$1-cka-14d-control-plane" -o jsonpath='{.status.containerStatuses[0].state.running.startedAt}' 2>/dev/null; }
      for attempt in 1 2 3; do
        [ "$(started kube-apiserver)" \> "$(started etcd)" ] && break
        kubectl exec "$CP" -- chroot /host sh -c '
          for c in kube-scheduler kube-controller-manager kube-apiserver; do
            crictl stop $(crictl ps --name "^$c$" -q) >/dev/null
          done' || true
        sleep 30
        until kubectl get --raw=/readyz >/dev/null 2>&1; do sleep 5; done
        sleep 10
      done
      echo "etcd started $(started etcd), kube-apiserver started $(started kube-apiserver)"
      kubectl get configmap keep-me
      kubectl get configmap after-backup || echo "after-backup is gone: restore worked"
      kubectl wait --for=condition=Ready nodes --all --timeout=180s
  "15.3":
    docs:
      - title: Certificate management with kubeadm
        url: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/
    hint: >-
      `kubeadm certs check-expiration` must run on the control plane (it reads
      `/etc/kubernetes/pki`). `kubeadm certs renew <name>` renews one, followed by a restart of the
      component that uses it.
    automated: true
    solution: |
      CP=$(kubectl get pods -o name | grep node-debugger-cka-14d-control-plane | head -1 || true)
      if [ -z "$CP" ]; then
        kubectl debug node/cka-14d-control-plane --image=busybox:1.36 --profile=sysadmin -- sleep 3600 >/dev/null
        CP=$(kubectl get pods -o name | grep node-debugger-cka-14d-control-plane | head -1 || true)
      fi
      kubectl wait --for=condition=Ready "$CP" --timeout=90s >/dev/null
      kubectl exec "$CP" -- chroot /host kubeadm certs check-expiration | tee answers/day15-certs.txt
  "15.4":
    docs:
      - title: Certificates and Certificate Signing Requests — normal user
        url: https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/#normal-user
      - title: Using RBAC authorization
        url: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
      - title: Configure access to multiple clusters
        url: https://kubernetes.io/docs/tasks/access-application-cluster/configure-access-multiple-clusters/
    hint: >-
      CN becomes the user name and O the group. The CSR object wants the PEM base64-encoded on one
      line (`base64 -w0`). After `kubectl certificate approve`, read `.status.certificate`, then build
      the kubeconfig with `kubectl config --kubeconfig=<file> set-cluster/set-credentials/set-context`.
    automated: true
    solution: |
      openssl genrsa -out answers/day15-jane.key 2048
      openssl req -new -key answers/day15-jane.key -subj "/CN=jane/O=cka-devs" -out answers/day15-jane.csr
      kubectl apply -f - <<EOF
      apiVersion: certificates.k8s.io/v1
      kind: CertificateSigningRequest
      metadata:
        name: jane
      spec:
        request: $(base64 -w0 < answers/day15-jane.csr)
        signerName: kubernetes.io/kube-apiserver-client
        expirationSeconds: 86400
        usages: [client auth]
      EOF
      kubectl certificate approve jane
      until [ -n "$(kubectl get csr jane -o jsonpath='{.status.certificate}')" ]; do sleep 2; done
      kubectl get csr jane -o jsonpath='{.status.certificate}' | base64 -d > answers/day15-jane.crt
      kubectl create role jane-pods --verb=get,list,watch --resource=pods
      kubectl create rolebinding jane-binding --role=jane-pods --user=jane
      # Kubeconfig for jane: same server and CA as the lab, jane's own key + certificate.
      KCFG=answers/day15-jane.kubeconfig
      SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
      kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > /tmp/lab-ca.crt
      kubectl config --kubeconfig=$KCFG set-cluster cka-lab --server="$SERVER" --certificate-authority=/tmp/lab-ca.crt --embed-certs=true
      kubectl config --kubeconfig=$KCFG set-credentials jane --client-key=answers/day15-jane.key --client-certificate=answers/day15-jane.crt --embed-certs=true
      kubectl config --kubeconfig=$KCFG set-context jane --cluster=cka-lab --user=jane --namespace=cka-d15
      kubectl config --kubeconfig=$KCFG use-context jane
      kubectl --kubeconfig=$KCFG get pods                                   # allowed
      kubectl --kubeconfig=$KCFG delete pod nothing 2>&1 | grep -i forbidden || true   # forbidden
  "15.5":
    docs:
      - title: Create static Pods
        url: https://kubernetes.io/docs/tasks/configure-pod-container/static-pod/
      - title: Kubelet configuration (staticPodPath)
        url: https://kubernetes.io/docs/reference/config-api/kubelet-config.v1beta1/
    hint: >-
      `grep staticPodPath /var/lib/kubelet/config.yaml` on the worker. Drop a Pod manifest there
      (with `namespace: cka-d15`); kubelet starts it and publishes a mirror Pod named
      `<pod>-<node>`. Delete the file to stop it — deleting the mirror Pod does nothing.
    automated: true
    solution: |
      W=$(kubectl get pods -o name | grep node-debugger-cka-14d-worker | grep -v worker2 | head -1 || true)
      if [ -z "$W" ]; then
        kubectl debug node/cka-14d-worker --image=busybox:1.36 --profile=sysadmin -- sleep 3600 >/dev/null
        W=$(kubectl get pods -o name | grep node-debugger-cka-14d-worker | grep -v worker2 | head -1 || true)
      fi
      kubectl wait --for=condition=Ready "$W" --timeout=90s >/dev/null
      kubectl exec "$W" -- chroot /host grep staticPodPath /var/lib/kubelet/config.yaml
      kubectl exec -i "$W" -- chroot /host sh -c 'cat > /etc/kubernetes/manifests/static-web.yaml' <<'EOF'
      apiVersion: v1
      kind: Pod
      metadata:
        name: static-web
        namespace: cka-d15
      spec:
        containers:
        - name: nginx
          image: nginx:1.27
      EOF
      until kubectl get pod static-web-cka-14d-worker >/dev/null 2>&1; do sleep 3; done
      kubectl wait --for=condition=Ready pod/static-web-cka-14d-worker --timeout=120s
      kubectl get pod static-web-cka-14d-worker -o wide
